<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧不動產與氣象 GIS 地圖系統 (實價登錄資料庫版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- 左側控制與分析面板 -->
    <div class="sidebar">
        <h2>🗺️ 智慧不動產與氣象 GIS</h2>
        <p class="desc">已串接台北市實價登錄 MySQL 資料庫與中央氣象署即時氣象。</p>

        <div class="form-group">
            <label for="citySelect">選擇縣市</label>
            <select id="citySelect" onchange="updateDistricts()">
                <!-- 動態填入 -->
            </select>
        </div>

        <div class="form-group">
            <label for="districtSelect">鄉鎮市區</label>
            <select id="districtSelect" onchange="onDistrictChange()">
                <!-- 動態填入 -->
            </select>
        </div>

        <div class="form-group">
            <label for="addressKeywordInput">地址 / 路段關鍵字搜尋</label>
            <div class="search-wrapper">
                <input type="text" id="addressKeywordInput" placeholder="例如：忠孝東路、信義路">
                <button type="button" class="btn-search" onclick="searchByKeyword()">搜尋</button>
            </div>
        </div>

        <button class="btn-query" onclick="fetchBackendData()">🚀 開始分析選定區域</button>
        <div id="loadingText" class="loading">正在向 MySQL 資料庫與氣象署查詢數據...</div>

        <!-- 數據儀表板結果區 -->
        <div class="results-container" id="resultPanel" style="display: none;">
            <h3>📊 區域即時分析報告</h3>
            
            <!-- 點擊此卡片可檢視詳細交易情況 -->
            <div class="card" onclick="openTransactionModal()" style="cursor: pointer;" title="點擊查看詳細交易概況">
                <div class="card-title">區域平均單價 (點擊看詳情)</div>
                <div class="card-value" id="priceVal">-</div>
                <div class="card-sub" id="sampleVal">-</div>
            </div>

            <div class="card">
                <div class="card-title">氣象觀測站氣溫</div>
                <div class="card-value" id="tempVal">-</div>
                <div class="card-sub" id="stationVal">-</div>
            </div>

            <div class="card">
                <div class="card-title">環境風險計算分數</div>
                <div class="card-value" id="riskVal">-</div>
                <div class="card-sub">綜合氣候與環境權重評估</div>
            </div>
        </div>
    </div>

    <!-- 右側滿版地圖 -->
    <div id="map"></div>

    <!-- 詳細交易情況彈出視窗 (Modal) -->
    <div class="modal-overlay" id="transactionModal">
        <div class="modal-content">
            <h3 id="modalTitle">📋 近期實價登錄交易摘要</h3>
            <div id="modalBody">
                <!-- 動態填入交易明細 -->
            </div>
            <button class="btn-close" onclick="closeTransactionModal()">關閉視窗</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let taiwanDistricts = {};
        let currentTransactionsData = [];
        let currentSelectedDistrict = "大安區";

        const map = L.map('map').setView([25.0478, 121.5170], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let currentMarker = L.marker([25.0330, 121.5654]).addTo(map)
            .bindPopup("<b>初始中心點</b>")
            .openPopup();

        window.onload = function() {
            fetch('http://127.0.0.1:8000/api/v1/districts')
                .then(res => res.json())
                .then(data => {
                    taiwanDistricts = data;
                    const citySelect = document.getElementById('citySelect');
                    citySelect.innerHTML = "";
                    
                    Object.keys(taiwanDistricts).forEach(city => {
                        const opt = document.createElement('option');
                        opt.value = city;
                        opt.innerHTML = city;
                        citySelect.appendChild(opt);
                    });
                    
                    citySelect.value = "臺北市";
                    updateDistricts();
                })
                .catch(err => console.error("無法取得行政區資料:", err));
        };

        function updateDistricts() {
            const city = document.getElementById('citySelect').value;
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.innerHTML = "";
            
            const districts = taiwanDistricts[city] || [];
            districts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.innerHTML = d;
                districtSelect.appendChild(opt);
            });
            onDistrictChange();
        }

        function onDistrictChange() {
            const city = document.getElementById('citySelect').value;
            currentSelectedDistrict = document.getElementById('districtSelect').value;
            if (!currentSelectedDistrict) return;
            const queryAddr = city + currentSelectedDistrict;
            
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryAddr)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 13);
                        currentMarker.setLatLng([lat, lon])
                            .setPopupContent(`<b>${queryAddr}</b>`)
                            .openPopup();
                    }
                }).catch(err => console.error("Geocoding error:", err));
        }

        function searchByKeyword() {
            const city = document.getElementById('citySelect').value;
            const district = document.getElementById('districtSelect').value;
            const keyword = document.getElementById('addressKeywordInput').value;
            
            if (!keyword) {
                alert("請輸入要搜尋的路段或地址關鍵字！");
                return;
            }

            const fullQuery = city + district + keyword;
            
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        
                        map.setView([lat, lon], 16);
                        currentMarker.setLatLng([lat, lon])
                            .setPopupContent(`<b>${fullQuery}</b>`)
                            .openPopup();

                        fetchDataByCoords(lat, lon, district);
                    } else {
                        alert("找不到該地址或路段！");
                    }
                })
                .catch(err => console.error(err));
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            currentMarker.setLatLng([lat, lng])
                .setPopupContent(`座標: ${lat.toFixed(4)}, ${lng.toFixed(4)}`)
                .openPopup();
            fetchDataByCoords(lat, lng, currentSelectedDistrict);
        });

        function fetchBackendData() {
            const lat = currentMarker.getLatLng().lat;
            const lng = currentMarker.getLatLng().lng;
            fetchDataByCoords(lat, lng, currentSelectedDistrict);
        }

        function fetchDataByCoords(lat, lng, districtName) {
            const loadingText = document.getElementById('loadingText');
            const resultPanel = document.getElementById('resultPanel');
            
            loadingText.style.display = "block";
            resultPanel.style.display = "none";

            const apiUrl = `http://127.0.0.1:8000/api/v1/analyze?district=${encodeURIComponent(districtName)}&lat=${lat}&lon=${lng}`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error("後端伺服器回應錯誤");
                    return response.json();
                })
                .then(data => {
                    loadingText.style.display = "none";
                    resultPanel.style.display = "block";

                    // 記錄近期交易資料供 Modal 使用
                    currentTransactionsData = data.recent_transactions || [];

                    document.getElementById('priceVal').innerText = data.real_estate_summary.average_unit_price.toLocaleString() + " 元/坪";
                    document.getElementById('sampleVal').innerText = "MySQL 實價登錄樣本數: " + data.real_estate_summary.sample_count;
                    
                    document.getElementById('tempVal').innerText = data.weather_summary.temperature + " °C";
                    document.getElementById('stationVal').innerText = "測站: " + data.weather_summary.station;
                    
                    document.getElementById('riskVal').innerText = data.environmental_risk_score;
                })
                .catch(error => {
                    loadingText.style.display = "none";
                    alert("無法連線至後端伺服器！請確認 FastAPI 是否已啟動。");
                    console.error("Error:", error);
                });
        }

        // 控制彈出視窗 (Modal)
        function openTransactionModal() {
            const modal = document.getElementById('transactionModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.innerText = `📋 [${currentSelectedDistrict}] 近期實價登錄交易明細`;
            body.innerHTML = "";

            if (currentTransactionsData.length === 0) {
                body.innerHTML = "<p style='color: #5f6368;'>目前此行政區無近期交易紀錄。</p>";
            } else {
                currentTransactionsData.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "transaction-item";
                    div.innerHTML = `
                        <div>📍 <b>地址：</b>${item.address}</div>
                        <div>💰 <b>總價：</b><span style="color: #d93025; font-weight: bold;">${item.price}</span></div>
                        <div>🏠 <b>建物型態：</b>${item.type} | <b>交易日期：</b>${item.date}</div>
                    `;
                    body.appendChild(div);
                });
            }

            modal.style.display = "flex";
        }

        function closeTransactionModal() {
            document.getElementById('transactionModal').style.display = "none";
        }
    </script>
</body>
</html>
